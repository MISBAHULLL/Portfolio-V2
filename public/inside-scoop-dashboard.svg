<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with glassmorphism effect -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3c;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0d1025;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee" />
      <stop offset="100%" style="stop-color:#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Main dashboard card -->
  <rect x="20" y="20" width="600" height="320" rx="20" fill="url(#bgGradient)" stroke="#2d3561" stroke-width="1"/>
  
  <!-- Decorative floating cubes -->
  <rect x="30" y="10" width="16" height="16" rx="3" fill="#8b5cf6" opacity="0.6"/>
  <rect x="55" y="5" width="12" height="12" rx="2" fill="#a78bfa" opacity="0.4"/>
  <rect x="580" y="15" width="14" height="14" rx="3" fill="#6366f1" opacity="0.5"/>
  <rect x="560" y="8" width="10" height="10" rx="2" fill="#818cf8" opacity="0.3"/>
  <rect x="300" y="8" width="10" height="10" rx="2" fill="#c4b5fd" opacity="0.4"/>
  
  <!-- Mini chart section (left) -->
  <rect x="45" y="50" width="180" height="120" rx="12" fill="#0f1629" stroke="#1e2546" stroke-width="1"/>
  
  <!-- Bar chart -->
  <rect x="65" y="100" width="18" height="50" rx="3" fill="url(#chartGradient)"/>
  <rect x="90" y="85" width="18" height="65" rx="3" fill="url(#chartGradient)"/>
  <rect x="115" y="95" width="18" height="55" rx="3" fill="url(#chartGradient)"/>
  <rect x="140" y="75" width="18" height="75" rx="3" fill="url(#chartGradient)"/>
  <rect x="165" y="110" width="18" height="40" rx="3" fill="url(#chartGradient)"/>
  <rect x="190" y="90" width="18" height="60" rx="3" fill="url(#chartGradient)"/>
  
  <!-- Line chart section (right) -->
  <rect x="240" y="50" width="180" height="120" rx="12" fill="#0f1629" stroke="#1e2546" stroke-width="1"/>
  
  <!-- Line chart with dots -->
  <polyline points="260,130 290,110 320,120 350,90 380,100 400,80" fill="none" stroke="url(#lineGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="260" cy="130" r="5" fill="#22d3ee"/>
  <circle cx="290" cy="110" r="5" fill="#22d3ee"/>
  <circle cx="320" cy="120" r="5" fill="#22d3ee"/>
  <circle cx="350" cy="90" r="5" fill="#60a5fa"/>
  <circle cx="380" cy="100" r="5" fill="#60a5fa"/>
  <circle cx="400" cy="80" r="5" fill="#60a5fa"/>

  <!-- Code snippet section -->
  <rect x="45" y="185" width="375" height="140" rx="12" fill="#0f1629" stroke="#1e2546" stroke-width="1"/>
  
  <!-- Code text -->
  <text x="65" y="220" fill="#c084fc" font-family="monospace" font-size="14" font-weight="500">const</text>
  <text x="110" y="220" fill="#22d3ee" font-family="monospace" font-size="14">fetchData</text>
  <text x="195" y="220" fill="#f8fafc" font-family="monospace" font-size="14">= async () =&gt; {</text>
  
  <text x="85" y="248" fill="#c084fc" font-family="monospace" font-size="14" font-weight="500">const</text>
  <text x="130" y="248" fill="#22d3ee" font-family="monospace" font-size="14">response</text>
  <text x="205" y="248" fill="#f8fafc" font-family="monospace" font-size="14">= await</text>
  <text x="275" y="248" fill="#fbbf24" font-family="monospace" font-size="14">fetch</text>
  <text x="315" y="248" fill="#a3e635" font-family="monospace" font-size="14">'/api/data'</text>
  <text x="395" y="248" fill="#f8fafc" font-family="monospace" font-size="14">;</text>
  
  <text x="85" y="276" fill="#c084fc" font-family="monospace" font-size="14" font-weight="500">return</text>
  <text x="143" y="276" fill="#22d3ee" font-family="monospace" font-size="14">response</text>
  <text x="218" y="276" fill="#f8fafc" font-family="monospace" font-size="14">.json();</text>
  
  <text x="65" y="304" fill="#f8fafc" font-family="monospace" font-size="14">};</text>

  <!-- Stats cards (right side) -->
  <rect x="440" y="50" width="160" height="60" rx="10" fill="#0f1629" stroke="#1e2546" stroke-width="1"/>
  <text x="460" y="75" fill="#94a3b8" font-family="system-ui" font-size="11">Total Users</text>
  <text x="460" y="98" fill="#f1f5f9" font-family="system-ui" font-size="20" font-weight="bold">12,847</text>
  <text x="545" y="98" fill="#22c55e" font-family="system-ui" font-size="12">+24%</text>

  <rect x="440" y="120" width="160" height="60" rx="10" fill="#0f1629" stroke="#1e2546" stroke-width="1"/>
  <text x="460" y="145" fill="#94a3b8" font-family="system-ui" font-size="11">Revenue</text>
  <text x="460" y="168" fill="#f1f5f9" font-family="system-ui" font-size="20" font-weight="bold">$84.2K</text>
  <text x="545" y="168" fill="#22c55e" font-family="system-ui" font-size="12">+18%</text>

  <rect x="440" y="190" width="160" height="60" rx="10" fill="#0f1629" stroke="#1e2546" stroke-width="1"/>
  <text x="460" y="215" fill="#94a3b8" font-family="system-ui" font-size="11">Conversion</text>
  <text x="460" y="238" fill="#f1f5f9" font-family="system-ui" font-size="20" font-weight="bold">4.28%</text>
  <text x="545" y="238" fill="#22c55e" font-family="system-ui" font-size="12">+12%</text>
</svg>
